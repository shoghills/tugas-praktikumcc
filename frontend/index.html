<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Loadout Inventory</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            padding: 2rem;
            margin: 0;
        }
        
        .container {
            background: #16213e;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 550px;
        }
        
        h1 {
            color: #e94560;
            margin-bottom: 0.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .subtitle {
            color: #a2a2a2;
            margin-bottom: 2rem;
            font-style: italic;
        }
        
        .card {
            background: #0f3460;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            border: 1px solid #1a1a2e;
        }
        
        ul {
            list-style-type: none;
            padding: 0;
        }
        
        li {
            background: #1a1a2e;
            margin: 0.5rem 0;
            padding: 1rem;
            border-radius: 5px;
            color: #43bccd;
            font-weight: bold;
            border-left: 4px solid #e94560;
        }
        
        .input-group {
            display: flex;
            gap: 0.5rem;
        }
        
        input[type="text"] {
            flex: 1;
            padding: 0.8rem;
            border: none;
            border-radius: 4px;
            background-color: #e0e0e0;
            color: #333;
            font-weight: bold;
        }
        
        button {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            transition: background 0.3s;
        }
        
        button:hover {
            background-color: #d13d56;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="judul-katalog">Memuat Inventory...</h1>
        <p id="info-pemilik" class="subtitle"></p>

        <div class="card">
            <h3>Daftar Item / Loadout</h3>
            <ul id="item-list">
                </ul>
        </div>

        <div class="card">
            <h3>Craft / Tambah Item Baru</h3>
            <div class="input-group">
                <input type="text" id="new-item-input" placeholder="Masukkan nama item (misal: Iron Pickaxe)...">
                <button onclick="tambahItem()">Craft</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
