<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Loadout Inventory</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 id="judul-katalog">Memuat Inventory...</h1>
        <p id="info-pemilik" class="subtitle"></p>

        <div class="card">
            <h3>Daftar Item / Loadout</h3>
            <ul id="item-list">
                </ul>
        </div>

        <div class="card">
            <h3>Craft / Tambah Item Baru</h3>
            <div class="input-group">
                <input type="text" id="new-item-input" placeholder="Masukkan nama item (misal: Iron Pickaxe)...">
                <button onclick="tambahItem()">Craft</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
